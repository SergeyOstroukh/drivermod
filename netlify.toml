[build]
  # No build step needed — static HTML/JS/CSS served directly
  command = "echo 'Static site, no build needed'"
  publish = "."

[build.environment]
  # Skip peer dependency conflicts (React packages not used in production)
  NPM_FLAGS = "--legacy-peer-deps"

[[headers]]
  for = "/auth-version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"
